# /etc/nginx/sites-available/choice   ——  CHOICE 子域名反代
# 部署脚本会把 choice-vn-crm.duckdns.org 替换成你的真实子域名（如 choice.example.com）。
# 证书由 certbot --nginx 自动补上 443 块，这里先给 80 的代理块即可。
server {
    server_name choice-vn-crm.duckdns.org;

    # 现场照片上传体积较大，必须放开，否则 Nginx 返回 413
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:5060;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/choice-vn-crm.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/choice-vn-crm.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = choice-vn-crm.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name choice-vn-crm.duckdns.org;
    return 404; # managed by Certbot


}
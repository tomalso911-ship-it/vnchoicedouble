    @keyframes cpPop { from{transform:translateY(20px);opacity:0;} to{transform:none;opacity:1;} }
    .cp-head { display:flex;align-items:center;justify-content:space-between;padding:12px 22px;background:linear-gradient(135deg,#E53935,#E53935);color:#fff;flex-shrink:0;cursor:move; }

    .cp-cur-group { display:grid;grid-template-columns:repeat(3,1fr);gap:6px; }

    /* 分期付款计划表格 — 横向滚动 + 关键列固定 */
    .cp-table-wrap { width:100%;overflow-x:auto; }
    .cp-table { min-width:1100px;border-collapse:collapse;font-size:11.5px; }
    .cp-table th, .cp-table td { border:1px solid #e0e0e0;padding:4px 6px;vertical-align:middle;white-space:nowrap; }
    .cp-table thead th { background:#FDECEA;color:#E53935;font-weight:700;text-align:center;position:sticky;top:0;font-size:11px;z-index:1; }

  @media print{
    /* ★ 空白首页根治（2026-09-05 用户反馈）：visibility:hidden 只是"看不见"但元素仍占布局高度，
       主界面 #app 被隐藏后照样把报告推到第 2 页 → 打印预览第一页全白。
       改用 display:none 把非目标元素彻底移出布局，第一页直接从报告内容开始。 */
    body > *{display:none !important;}
    /* 只恢复带 .print-target 标记的打印目标（由 printModalById 在调用 window.print() 前打标） */
    body > .print-target{display:block !important;}
    .print-target{position:static !important;background:none !important;padding:0 !important;margin:0 !important;overflow:visible !important;height:auto !important;}
    /* ★ 打印保留背景色/斑马线/图表配色：浏览器默认 print-color-adjust:economy 会丢弃所有背景，
       必须强制 exact 才能把红表头、斑马线、黄色高亮、饼图配色一起打出来 */
    .print-target,.print-target *{-webkit-print-color-adjust:exact !important;print-color-adjust:exact !important;color-adjust:exact !important;}

    /* —— 客户付款智能报告 / AGI付款报告（cpr-overlay）—— */
    .print-target .cpr-box{position:static !important;top:auto !important;bottom:auto !important;left:auto !important;right:auto !important;margin:0 !important;box-shadow:none !important;max-width:100% !important;width:100% !important;height:auto !important;overflow:visible !important;resize:none !important;}
    .print-target .cpr-body{max-height:none !important;height:auto !important;overflow:visible !important;padding:12px 18px !important;}
    .print-target .cpr-foot,.print-target .cpr-close{display:none !important;}

    /* —— 项目综合报告（rpt-overlay）—— */
    .print-target .rpt-modal{box-shadow:none !important;max-width:100% !important;}
    .print-target .rpt-foot{display:none !important;}

    /* —— 报告/概况型弹窗（潜在/失败/签约/全部项目概况 modal-overlay）—— */
    .print-target .modal{position:static !important;top:auto !important;bottom:auto !important;left:auto !important;right:auto !important;margin:0 !important;box-shadow:none !important;max-width:100% !important;width:100% !important;height:auto !important;overflow:visible !important;resize:none !important;}
    .print-target .modal [style*="max-height"],.print-target .modal [style*="overflow-y"]{max-height:none !important;height:auto !important;overflow:visible !important;}
    /* 打印时隐藏弹窗内所有按钮（关闭 / 打印 / 货币切换 RMB·USD·VND 等），只保留报告正文 */
    .print-target .modal button{display:none !important;}

    html,body{height:auto !important;overflow:visible !important;}
    @page { size: auto; margin: 8mm; }
  }

    /* ===== 全局模态框可拖拽 & 可调整大小 =====
       居中方式改为 inset:0 + margin:auto（不依赖 transform），
       使 resize:both 与拖拽时直接写 top/left 均正常工作。 */
    /* 一级模态框（缩放改由 JS 手柄 .rsz-handle 控制，禁用原生 resize:both 避免与拖拽冲突） */
    .modal { position:fixed; top:66px; bottom:0; left:0; right:0; margin:auto; resize:none; overflow:auto; width:940px; max-height:calc(90vh - 66px); }
    .modal.dragging { cursor:grabbing; }
    .export-confirm-box.dragging { cursor:grabbing; }
    .pt-editor-box { position:fixed; top:66px; bottom:0; left:0; right:0; margin:auto; resize:none; overflow:auto; }
    .pt-editor-box.dragging { cursor:grabbing; }
    .detail-view-box { position:fixed; top:66px; bottom:0; left:0; right:0; margin:auto; resize:none; overflow:auto; }
    .detail-view-box.dragging { cursor:grabbing; }

    /* 二级模态框 */
    .cust-pay-modal { position:fixed; top:66px; bottom:0; left:0; right:0; margin:auto; resize:none; overflow:auto; }
    .cust-pay-modal.dragging { cursor:grabbing; }
    .cm-modal { position:fixed; top:66px; bottom:0; left:0; right:0; margin:auto; resize:none; overflow:auto; }
    .cm-modal.dragging { cursor:grabbing; }
    .gsr-modal { position:fixed; top:66px; bottom:0; left:0; right:0; margin:auto; resize:none; overflow:auto; }
    .gsr-modal.dragging { cursor:grabbing; }
    .cpr-box { position:fixed; top:66px; bottom:0; left:0; right:0; margin:auto; resize:none; overflow:auto; }
    .cpr-box.dragging { cursor:grabbing; }

    /* 拖拽时的视觉反馈 */
    .modal.dragging, .export-confirm-box.dragging, .pt-editor-box.dragging,
    .detail-view-box.dragging, .cust-pay-modal.dragging, .cm-modal.dragging,
    .gsr-modal.dragging, .cpr-box.dragging, .addm-modal.dragging, .auth-modal.dragging {
      box-shadow:0 20px 60px rgba(0,0,0,.45) !important;
      user-select:none; -webkit-user-select:none;
    }

    /* 日历弹出框可拖拽 */
    .cp-cal-popup { resize:none; }
    .cp-cal-popup.dragging { user-select:none; }
    .cm-cal-popup { resize:none; }
    .cm-cal-popup.dragging { user-select:none; }

    /* 日历拖拽手柄 */
    .cp-cal-head { cursor:move; user-select:none; }
    .cm-cal-head { cursor:move; user-select:none; }

    /* 模态框标题栏作为拖拽手柄的视觉提示 */
    .modal > h2, .export-confirm-box > .ec-title, .pt-editor-box > .pt-title,
    .detail-view-box > .dv-title, .cp-head, .cm-head, .gsr-head, .cpr-head {
      cursor:move; user-select:none;
    }
    .modal > h2:active, .export-confirm-box > .ec-title:active, .pt-editor-box > .pt-title:active,
    .detail-view-box > .dv-title:active, .cp-head:active, .cm-head:active, .gsr-head:active, .cpr-head:active {
      cursor:grabbing;
    }
    /* 标题栏内的按钮/输入框保持可交互（不被拖拽干扰） */
    .cp-head button, .cp-head select, .cp-head input,
    .cm-head button, .cm-head select, .cm-head input,
    .gsr-head button, .gsr-head select, .gsr-head input,
    .cpr-head button, .cpr-head select, .cpr-head input,
    .modal > h2 button, .detail-view-box > .dv-title button { cursor:default; user-select:auto; }

  /* 销售人员设置模态框 */


  /* ==================== 登录界面 ==================== */
  #loginPage {
    position: fixed; inset: 0; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #eef1f3 0%, #e2e6ea 50%, #d6dbe0 100%);
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #loginPage.hidden { display: none; }
  /* 登录卡右上角三语切换：橙色胶囊 + 圆角按钮，悬停在卡片右上角 */
  .login-card { position:relative; }
  .login-lang-switch { position:absolute; top:14px; right:14px; z-index:3;
    display:flex; align-items:center; gap:3px;
    background:#fff; border:1px solid #e3e7ec;
    border-radius:22px; padding:3px 6px;
    box-shadow:0 2px 8px rgba(0,0,0,.08); }
  .login-lang-switch button { font-size:13px; font-weight:700; padding:5px 12px;
    border:none; border-radius:16px; background:transparent; color:#6a7886;
    cursor:pointer; transition:all .15s; line-height:1.4; min-width:32px; }
  .login-lang-switch button:hover { color:#D32F2F; }
  .login-lang-switch button.active { background:#D32F2F; color:#fff;
    box-shadow:0 2px 6px rgba(211,47,47,.35); }
  @media (max-width:640px){
    .login-lang-switch { top:10px; right:10px; padding:2px 4px; }
    .login-lang-switch button { font-size:12px; padding:4px 10px; min-width:28px; }
  }
  .login-card {
    width: 400px; max-width: 92vw;
    background: #ffffff; border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    padding: 40px 36px 28px;
    text-align: center;
    animation: loginFade .4s ease;
  }
  @keyframes loginFade { from { opacity:0; transform:translateY(12px);} to { opacity:1; transform:none;} }
  .login-logo { margin: 0 auto 16px; width: 150px; height: 150px; }
  .login-logo svg { width: 100%; height: auto; max-height: 100%; display: block; }
  .login-title { font-size: 24px; font-weight: 700; color: #D32F2F; margin: 0 0 4px; letter-spacing: .5px; }
  .login-sub { font-size: 13px; color: #7a8a99; margin: 0 0 26px; }
  .login-field { margin-bottom: 16px; text-align: left; }
  .login-field label { display:block; font-size: 12px; color:#5a6a7a; margin-bottom: 6px; font-weight:600; }
  .login-field input {
    width: 100%; box-sizing: border-box; height: 44px; padding: 0 14px;
    border: 1px solid #d7dee6; border-radius: 9px; font-size: 14px; color:#23303d;
    background:#f7f9fb; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  .login-field input:focus { border-color: #D32F2F; background:#fff; box-shadow: 0 0 0 3px rgba(211,47,47,.18); }
  .login-remember { display:flex; align-items:center; gap:8px; margin:2px 0 6px; color:#8a97a5; font-size:13px; cursor:pointer; user-select:none; }
  .login-remember input { accent-color:#D32F2F; width:16px; height:16px; cursor:pointer; }
  .login-btn {
    width: 100%; height: 46px; border: none; border-radius: 9px; cursor: pointer;
    font-size: 15px; font-weight: 700; color:#fff; letter-spacing:1px;
    background: linear-gradient(135deg, #E53935, #D32F2F);
    transition: transform .1s, box-shadow .2s; margin-top: 6px;
  }
  .login-btn:hover { box-shadow: 0 8px 20px rgba(211,47,47,.35); }
  .login-btn:active { transform: translateY(1px); }
  .login-btn:disabled { opacity:.6; cursor:not-allowed; }
  .login-links { margin-top: 22px; display: flex; gap: 12px; justify-content: center; }
  .login-link {
    background: none; border: none; cursor: pointer;
    color: #D32F2F; font-size: 13px; font-weight:600; padding: 6px 4px;
  }
  .login-link:hover { text-decoration: underline; }
  .login-error { color:#e74c3c; font-size: 13px; min-height: 18px; margin-top: 10px; text-align:center; }
  .login-footer { margin-top: 18px; font-size: 11px; color:#a5b2bf; }

  /* ===== 登录页 · 横屏矮屏适配 =====
     手机横屏时可用高度很小（常见 360~430px），
     原尺寸下 LOGO 150px + 标题 + 两个输入框 + 按钮会超出屏幕，
     导致界面被截断、LOGO 看不到。这里整体压缩。 */
  @media screen and (orientation: landscape) and (max-height: 560px) {
    #loginPage {
      align-items: flex-start;
      overflow-y: auto;
      padding: 10px 0;
    }
    .login-card {
      width: 420px;
      padding: 14px 26px 12px;
      border-radius: 12px;
      margin: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,.4);
    }
    .login-logo { width: 58px; height: 58px; margin: 0 auto 6px; }
    .login-title { font-size: 18px; margin: 0 0 2px; }
    .login-sub   { font-size: 11px; margin: 0 0 10px; }
    .login-field { margin-bottom: 8px; }
    .login-field label { font-size: 11px; margin-bottom: 3px; }
    .login-field input { height: 34px; font-size: 13px; padding: 0 11px; }
    .login-btn   { height: 36px; font-size: 14px; margin-top: 2px; }
    .login-links { margin-top: 9px; gap: 8px; }
    .login-link  { font-size: 12px; padding: 4px 3px; }
    .login-error { min-height: 15px; margin-top: 5px; font-size: 12px; }
    .login-footer{ margin-top: 6px; font-size: 10px; }
  }
  /* 极矮屏（高度不足 380px）：进一步压缩，隐藏次要元素保证核心可操作 */
  @media screen and (orientation: landscape) and (max-height: 380px) {
    .login-card { width: 380px; padding: 10px 20px 8px; }
    .login-logo { width: 42px; height: 42px; margin: 0 auto 4px; }
    .login-title { font-size: 16px; }
    .login-sub   { display: none; }
    .login-field input { height: 30px; }
    .login-btn   { height: 32px; }
    .login-links { margin-top: 6px; }
    .login-footer{ display: none; }
  }
  /* ===== 顶部导航栏 (Top Bar) ===== */
  #topbar {
    position: fixed; top:0; left:0; right:0; height:40px; z-index: 1000;
    display: flex; align-items: center; padding: 0 14px; gap: 14px;
    background: rgb(183, 221, 121);
    box-shadow: 0 2px 10px rgba(0,100,0,.25);
    font-family: "Segoe UI", Arial, sans-serif;
  }
  #topbar.hidden { display: none; }
  .tb-logo { display:flex; align-items:center; gap:6px; white-space:nowrap; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:none; }
  .tb-logo * { user-select:none; -webkit-user-select:none; }
  .tb-logo svg { width:40px; height:40px; border-radius:4px; display:block; flex:none; pointer-events:none; }
  .tb-logo-mark { font-size:14px; font-weight:800; color:#D32F2F; letter-spacing:.5px; pointer-events:none; }
  .tb-logo-slats { font-size:14px; font-weight:800; color:#D32F2F; letter-spacing:.5px; pointer-events:none; }
  .tb-logo-name { font-size:14px; font-weight:800; color:#000000; pointer-events:none; }

  .tb-logo::selection { background:transparent; }
  .commission-page { padding:20px; }
  /* 模态框打开时：语言切换保持可点，其他顶部导航项禁用 */
  body.modal-open .tb-item,
  body.modal-open .tb-logo,
  body.modal-open .tb-fit,
  body.modal-open .tb-user,
  body.modal-open .tb-logout { pointer-events:none; opacity:.45; }
  body.modal-open .lang-switch,
  body.modal-open .lang-switch * { pointer-events:auto; opacity:1; }
  /* 佣金表格：内容超宽/超高时自动出横向(底部)与纵向(右侧)滚动条——浏览器放大缩小时尤其实用 */
  .commission-page .users-table-wrap { overflow:auto; }
  /* 主表容器：超高（项目多）→ 右侧纵向滚动条；超宽（屏幕窄）→ 底部横向滚动条，均为浏览器原生 */
  .commission-page #commissionTableWrap { overflow:auto; max-height:65vh; }
  /* sticky 表头必须用 separate（collapse 下 sticky 单元格的边框会丢失），故边框改画在 td 上 */
  #commissionTable { border-collapse:separate; border-spacing:0; }
  #commissionTable thead th { position:sticky; z-index:3; background:#E53935; }
  #commissionTable thead tr:first-child th { top:0; }
  #commissionTable thead tr:nth-child(2) th { top:43px; }   /* JS 会按首行实际高度覆盖 */
  #commissionTable tbody td { border-bottom:1px solid #eee; }
  .commission-page .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .commission-page .page-header h2 { font-size:20px; color:#E53935; margin:0; font-weight:700; }
  /* 设备金额三币子列表头：与 WON 表 RMB粉/USD蓝/VND黄 同款配色（佣金表+受益人表共用） */
  #commissionTable th.comm-sub, #benTable th.comm-sub { font-size:12px; padding:8px 10px; text-align:center; }
  #commissionTable th.comm-rmb, #benTable th.comm-rmb { background:#fde8e8 !important; color:#c0392b !important; }
  #commissionTable th.comm-usd, #benTable th.comm-usd { background:#e8edf8 !important; color:#2c5fa8 !important; }
  #commissionTable th.comm-vnd, #benTable th.comm-vnd { background:#f8f4e0 !important; color:#b8860b !important; }
  #commissionTable tbody td.comm-rmb, #benTable tbody td.comm-rmb { background:#fdf3f3; color:#8a2a2a; }
  #commissionTable tbody td.comm-usd, #benTable tbody td.comm-usd { background:#f2f5fc; color:#2c5fa8; }
  #commissionTable tbody td.comm-vnd, #benTable tbody td.comm-vnd { background:#fbf8ec; color:#9a7b12; }
  /* 受益人表在弹窗内：紧凑行高 */
  #benTable th { padding:8px 10px; font-size:12px; }
  #benTable td { padding:7px 10px; font-size:12px; white-space:nowrap; }
  /* 佣金日期字段：点击弹出可拖动日历 */
  .comm-date { cursor:pointer; }
  /* 极高的 z-index + 强制 pointer-events:auto，避免被任何模态/锁定/二级弹窗抢走点击 */
  #commCalPopup { position:fixed; z-index:50000; width:252px; background:#fff; border:1px solid #f0c8a8;
                  border-radius:10px; box-shadow:0 12px 30px rgba(40,30,15,.28); padding:10px 12px; display:none;
                  pointer-events:auto !important; }
  #commCalPopup, #commCalPopup * { pointer-events:auto !important; }
  #commCalPopup .cc-head { display:flex; align-items:center; justify-content:space-between; cursor:move;
                           user-select:none; -webkit-user-select:none; padding:2px 2px 8px; }
  #commCalPopup .cc-nav { border:none; background:#FDECEA; color:#B71C1C; width:24px; height:24px;
                          border-radius:6px; cursor:pointer; font-size:14px; line-height:1; }
  #commCalPopup .cc-title { font-weight:700; color:#E53935; font-size:13px; }
  #commCalPopup .cc-close { border:none; background:none; color:#999; font-size:18px; cursor:pointer; line-height:1; }
  /* ===== 三个日历（comm/cp/cm）统一外观：年月快捷下拉 ===== */
  #commCalPopup .cc-ym,
  .cp-cal-ym,
  .cm-cal-ym { display:flex; gap:6px; padding:0 2px 6px; }
  #commCalPopup .cc-ym select,
  .cp-cal-ym select,
  .cm-cal-ym select { flex:1 1 0; min-width:0; height:26px; font-size:12px; color:#333;
    border:1px solid #f0c8a8; border-radius:6px; background:#fff; padding:0 4px; cursor:pointer;
    outline:none; pointer-events:auto; }
  #commCalPopup .cc-ym select:focus,
  .cp-cal-ym select:focus,
  .cm-cal-ym select:focus { border-color:#E53935; box-shadow:0 0 0 2px rgba(211,47,47,.15); }
  /* 统一：日历头部为可拖动橙色条 */
  .cp-cal-head, .cm-cal-head, #commCalPopup .cc-head { cursor:move; user-select:none; -webkit-user-select:none; }
  /* 统一：关闭/Today 按钮风格 */
  .cp-cal-ym + .cp-cal-week, .cm-cal-ym + .cm-cal-week { margin-top:2px; }
  #commCalPopup .cc-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
  #commCalPopup .cc-wd { text-align:center; font-size:11px; color:#999; padding:3px 0; font-weight:700; }
  /* 日期格为 <button>：重置浏览器默认样式，确保与原来 div 外观一致且可点击 */
  #commCalPopup .cc-day { text-align:center; font-size:12px; padding:5px 0; border-radius:6px;
    cursor:pointer; color:#333; border:none; background:transparent; width:100%;
    font-family:inherit; line-height:1.4; }
  #commCalPopup .cc-day:hover { background:#FDECEA; }
  #commCalPopup .cc-day.today { box-shadow:inset 0 0 0 1px #E53935; }
  #commCalPopup .cc-day.sel { background:#E53935; color:#fff; font-weight:700; }
  #commCalPopup .cc-day.empty { cursor:default; visibility:hidden; }
  #commCalPopup .cc-foot { margin-top:8px; text-align:center; }
  #commCalPopup .cc-today-btn { border:1px solid #E53935; background:#fff; color:#E53935; font-size:12px;
                                padding:4px 12px; border-radius:6px; cursor:pointer; }
  .commission-placeholder { padding:60px 20px; text-align:center; color:#777; font-size:16px; background:#f7f8fa; border-radius:10px; border:1px dashed #d0d5dd; }
  /* ===== 个人佣金页顶部按钮区 ===== */
  .comm-btns { display:flex; align-items:center; gap:8px; }
  .comm-btn-ghost { background:#fff; color:#E53935; border:1px solid #E53935; padding:8px 16px; border-radius:6px;
                    font-size:13px; font-weight:600; cursor:pointer; transition:background .15s; white-space:nowrap; }
  .comm-btn-ghost:hover { background:#fff5eb; }
  /* ===== 佣金主表：十字高亮（与 WON/CRM 同款：整行淡黄 + 整列淡黄 + 交叉格加亮黄描边）=====
     列容器必须用 <td data-col="N">，由 onCommCrossOver / onCommCrossOut 在 hover 时切换 .row-hl/.col-hl/.cross-hl */
  #commissionTable tbody tr:hover td:not(.row-hl):not(.col-hl):not(.cross-hl) { background:#fff8f0; }
  #commissionTable tbody td.row-hl { background:#fff6cf !important; }
  #commissionTable tbody td.col-hl { background:#fff6cf !important; }
  #commissionTable tbody td.cross-hl { background:#ffe680 !important; box-shadow:inset 0 0 0 1.5px #e0a800; }
  #commissionTable tbody tr:nth-child(even) td.row-hl,
  #commissionTable tbody tr:nth-child(even) td.col-hl { background:#ffe89b !important; }

  /* ===== 用户与授权表：十字高亮（更聚焦：行 #fff6cf / 列 #fff6cf / 交叉 #ffe680 加 2px 橙色描边）=====
     与 WON/CRM 同体系，但交叉格加大描边让用户一眼锁定所在单元格。 */
  #usersTable tbody tr:hover td:not(.row-hl):not(.col-hl):not(.cross-hl) { background:#fff8f0; }
  #usersTable tbody td.row-hl { background:#fff6cf !important; }
  #usersTable tbody td.col-hl { background:#fff6cf !important; }
  #usersTable tbody td.cross-hl { background:#ffd84d !important; box-shadow:inset 0 0 0 2px #e0a800; }
  #usersTable tbody tr:nth-child(even) td.row-hl,
  #usersTable tbody tr:nth-child(even) td.col-hl { background:#ffe89b !important; }
  /* 假死复活热区：透明占位（位于「适应」与语言切换之间），宽约 72px 供连击 5 下 */
  .comm-btn-exit { background:#FFC107; color:#3a2c00; border:1px solid #e6ac00; padding:7px 13px;
                   border-radius:6px; font-size:12px; font-weight:700; cursor:pointer;
                   transition:background .15s, transform .15s; white-space:nowrap; }
  .comm-btn-exit:hover { background:#ffcd38; }
  .comm-btn-exit:active { transform:scale(.96); }
  /* ===== 查看总报告模态框（骨架与其他佣金弹窗统一：.auth-modal + 内联宽度 + 底部 auth-modal-btns） ===== */
  .rep-section { margin-bottom:26px; }

  /* 放大镜查看按钮：白底圆形 + 橙色带手柄放大镜（纯图标，无文字；SVG 内联不受字体影响） */
  .rep-zoom-btn { width:34px; height:34px; border-radius:50%; border:1.5px solid #f3c9a4; flex:none;
                  background:#fff; display:inline-flex; align-items:center; justify-content:center;

  .rep-zoom-btn:hover { background:#FDECEA; transform:scale(1.1); }

  /* 货币切换胶囊（RMB/USD/VND）：选中=深橙实底白字，未选=白底橙字 */
  .rep-cur-switch { display:inline-flex; gap:6px; flex:none; }

  .rep-cur-pill:hover { background:#FDECEA; }
  .rep-cur-pill.active { background:#e2711d; border-color:#e2711d; color:#fff; }
  .rep-cur-pill:active { transform:scale(.95); }
  .rep-cards { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:14px; }
  .rep-card { flex:1 1 130px; min-width:130px; background:#f8f9fb; border:1px solid #e3e8ef;
              border-radius:8px; padding:10px 12px; }
  .rep-card .rc-label { font-size:12px; color:#7a8699; margin-bottom:4px; }
  .rep-card .rc-value { font-size:16px; font-weight:800; color:#2c3e50; white-space:nowrap; }
  .rep-card.rc-green .rc-value { color:#1e8e4e; }
  .rep-card.rc-red .rc-value { color:#d64541; }
  .rep-card.rc-blue .rc-value { color:#2e86de; }
  .rep-table-wrap { overflow:auto; max-height:340px; border:1px solid #e3e8ef; border-radius:8px; }
  .rep-table { width:100%; border-collapse:separate; border-spacing:0; font-size:13px; }
  .rep-table thead th { position:sticky; top:0; z-index:2; background:#E53935; color:#fff;

  /* 导航菜单：标签较多时允许横向滚动，但隐藏底部滚动条，避免英文标签多时出现难看/占位的横条。
     触摸板/鼠标滚轮横向仍可滚动；JS 会动态压缩字号/间距/必要时切换短标签，尽量避免溢出。 */
  .tb-menu {
    display:flex; align-items:center; justify-content:space-evenly; flex:1;
    overflow-x:auto; overflow-y:hidden;
    scrollbar-width: none;
    -ms-overflow-style: none;

    scroll-behavior: smooth;
    padding-bottom: 0;
  }

  /* 模态框打开时锁定顶部导航标签（语言切换按钮不受影响） */
  .tb-menu.nav-locked .tb-item { pointer-events:none; opacity:.45; cursor:not-allowed; filter:grayscale(.3); }
  /* 模态框打开时锁定背景表头交互：排序箭头 + 审批表表头排序/筛选，禁点击（不改变外观） */
  body.ui-locked .sort-indicator,
  body.ui-locked .th-label,
  body.ui-locked .th-filter-input { pointer-events:none; }
  .tb-item {
    border:none; background:transparent; color:#000; cursor:pointer;

  .tb-item.active { background:#fff; color:#D32F2F; margin:2px 0; padding:8px 12px; border-radius:22px; }
  /* ===== 待审批角标（Approvals 导航右下角小红底白字数字，绝不遮挡文字） ===== */
  .pend-badge {
    position:absolute; top:auto; bottom:1px; right:1px;
    min-width:10px; height:10px; padding:0 1px;
    background:#e74c3c; color:#fff;
    border-radius:5px; border:1px solid #fff;
    font-size:7px; line-height:1; font-weight:700;

  /* 给导航按钮右侧留出足够空间，确保角标与文字彻底分离 */

  /* ===== 「适应屏幕」按钮 =====
     默认隐藏（电脑上不需要）；只在手机横屏/矮屏显示。
     默认不缩放，与浏览器 100% 一致，宽表格横向滚动查看；
     点一下把整张表整体缩放到容器宽度，一屏看完（字会变小）；再点还原。 */
  .tb-fit {
    display:none;
    border:1px solid rgba(0,0,0,.35); background:transparent; color:#000;
    font-size:9px; font-weight:700; padding:5px 9px; border-radius:6px; cursor:pointer;
    white-space:nowrap; transition: background .15s, color .15s, border-color .15s;
  }

  .tb-fit.on { background:#D32F2F; color:#fff; border-color:transparent; }
  /* ===== 手机横屏 / 矮屏：压缩顶部导航，保证 6 个标签一屏可见 =====
     背景：手机横屏时视口宽度其实等于"竖屏的高度"，常见只有 850~930px，
     而默认 15px 字号 + 18px 左右内边距下，6 个标签共需约 1240px，
     必然溢出进 .tb-menu 的横向滚动区后面的标签看不到
     （APP 里表现为只剩 Dashboard / Potential Projects / Won Pr…）。
     这里统一缩小字号、间距、LOGO 与右侧信息区，
     把菜单宽度需求从 1240px 降到约 600px，6 个标签即可全部显示。 */
  @media (orientation: landscape) and (max-height: 560px) {

    }
    .tb-item.has-pend-badge { padding-right: 24px; }
    .tb-item.active.has-pend-badge { padding-right: 26px; }
    .tb-right { gap: 8px; }
    .lang-switch { padding: 2px 5px; gap: 2px; }
    .lang-switch-label { display: none; }
    .lang-switch button { font-size: 9px; padding: 2px 7px; }
    .tb-user { font-size: 9px; gap: 4px; }
    .tb-user-avatar { width: 20px; height: 20px; font-size: 9px; }
    .tb-user-role { display: none; }
    .tb-logout { font-size: 9px; padding: 5px 10px; }
    /* 「适应屏幕」按钮只在窄屏出现，避免占用桌面顶栏空间 */
    .tb-fit { display: inline-block; font-size: 9px; padding: 4px 8px; }

    .app-body { margin-top: 42px; }

  }

  /* 弹窗通用 */
  .auth-modal-overlay {
    /* z-index 必须高于 #loginPage(99999)：
       登录页层级是 99999，若弹窗低于它，弹窗虽已显示却被登录页完全遮挡，
       表现为"点了忘记密码/重设密码没反应" —— 这是历史遗留的层级漏洞。 */
    position: fixed; top:56px; left:0; right:0; bottom:0; z-index: 100001;
    background: rgba(15,25,35,.55); display:flex; align-items:flex-start; justify-content:center; padding:10px 12px 12px 12px;
    overflow-y: auto;
  }
  /* 二级弹窗（在「新增受益人」弹窗之上弹出的锁定/确认/申请）：必须高于主弹窗，
     否则因 DOM 顺序在前、同级 z-index 会被主弹窗完全遮住（表现为「弹窗不触发」） */
  #commAmtLockOverlay,
  #benDoneOverlay,
  #benReactOverlay,
  #commAmtReqOverlay { z-index: 10100; }
  .auth-modal-overlay.hidden { display:none; }
  /* ===== 双击标题栏最大化（.mmax）===== [FROZEN 契约：单一真相源，禁止特例覆盖]
     ★ 这是所有弹窗「最大化态」外观的唯一规则来源。任何弹窗被加上 .mmax 后，
       外观必须完全一致（上贴 #topbar 底沿、左右下贴视口、无圆角、无内边距），
       不得为某个具体弹窗写 `.xxx.mmax{ top/left/... }` 之类的例外。
       要调整全局最大化格式，只改这一处；切勿在别处新增 !important 覆盖。
     放大态：上边由 JS 动态测量 #topbar 底沿写入 top（贴齐导航栏底部、不遮挡导航栏），
     左右下三边紧贴视口边缘（left/right/bottom:0），无圆角、无内边距，
     成为导航栏下方的一整块。top 的 !important 仅作兜底（JS 会用内联 important 覆盖）。
     不设置 z-index，避免破坏二级弹窗（10100）与主弹窗的层级关系。
     【接入约定】新弹窗想获得统一最大化格式，只需：① 用 BOX_SEL 中的受控盒子类名，
       或 ② 在盒子上加 data-mmax-btn="1"；injectMaxBtn（含 MutationObserver）会自动
       注入 □ 按钮，双击标题栏也能放大。无需为每个弹窗单独写代码。 */
  .mmax {
    position: fixed !important;
    top: 64px !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: auto !important;
    min-width: 0 !important;
    max-width: none !important;
    height: auto !important;
    min-height: 0 !important;
    max-height: none !important;
    margin: 0 !important;
    transform: none !important;
    border-radius: 0 !important;
  }
  /* 可双击放大的标题栏：提示可放大 */
  .modal > h2, .modal-header, .gsr-head, .cm-head, .cpr-head, .rpt-head,
  .appr-drawer-head, .drawer-header, .addm-head, .cp-head,
  .comm-lock-box > h3, .aa-title, .dc-title,
  .crm-orange-confirm-title, .ec-title, .pt-title, .dv-title,
  .dash-chart-lightbox-head { cursor: zoom-in; user-select: none; }
  /* auth-modal 标题栏：无双击放大功能，放大镜光标是残留样式 —— 恢复普通箭头；
     保留 user-select:none（按住标题拖动弹窗时不选中文字）。已注册拖拽的弹窗
     （查看与审批/受益人）由各自 ID 规则显示 cursor:move，特异度更高不受影响。 */
  .auth-modal > h3 { cursor: default; user-select: none; -webkit-user-select: none; }
  .mmax > h2, .mmax > h3, .mmax > .modal-header, .mmax > .gsr-head,
  .mmax > .cm-head, .mmax > .cpr-head, .mmax > .rpt-head,
  .mmax > .appr-drawer-head, .mmax > .drawer-header,
  .mmax > .addm-head, .mmax > .cp-head { cursor: zoom-out; }
  /* ===== 最大化态：内容区整体等比放大 =====
     满屏后 11px 级正文字太小不协调 → 对内容容器加 zoom（布局级缩放，
     文字/输入框/下拉/表格/按钮同步放大，滚动条与换行自动重排，渲染不发虚）。
     只缩放可滚动内容与底部按钮行，不缩放 .mmax 盒子本身（fixed 定位尺寸不被破坏）；
     日历等 fixed 浮层在容器外，坐标按视口计算，不受影响。
     max-height 用 calc(…/zoom) 换算：保证内容区占满剩余高度且底部按钮始终可见
     （zoom 是否缩放 vh 因浏览器实现而异，除以 zoom 后两种行为都不溢出）。
     桌面 1.4；窄屏（手机横屏 ≤920px）1.6。 */
  .mmax #modalBody, .mmax #crmModalBody,
  .mmax .cm-body, .mmax .addm-body, .mmax .cp-body,
  .mmax .cm-foot, .mmax .addm-foot, .mmax .cp-foot,
  .mmax.modal > div:last-of-type { zoom: 1.4; }
  .mmax #modalBody, .mmax #crmModalBody { max-height: calc((100vh - 215px) / 1.4) !important; }
  .mmax .cm-body, .mmax .addm-body, .mmax .cp-body { max-height: calc((100vh - 190px) / 1.4) !important; }
  @media (max-width: 920px) {
    .mmax #modalBody, .mmax #crmModalBody,
    .mmax .cm-body, .mmax .addm-body, .mmax .cp-body,
    .mmax .cm-foot, .mmax .addm-foot, .mmax .cp-foot,
    .mmax.modal > div:last-of-type { zoom: 1.6; }
    .mmax #modalBody, .mmax #crmModalBody { max-height: calc((100vh - 215px) / 1.6) !important; }
    .mmax .cm-body, .mmax .addm-body, .mmax .cp-body { max-height: calc((100vh - 190px) / 1.6) !important; }
  }

  .modal-tabs { display:flex; background:#fafafa; border-bottom:1px solid #eee; }

  .modal-body { padding:16px 20px; overflow:auto; flex:1; font-size:14px; }
  .modal-footer { padding:12px 18px; border-top:1px solid #eee; display:flex; align-items:center; justify-content:space-between; background:#fcfcfc; position:relative; z-index:7; padding-right:28px; }
  .modal-footer .hint { font-size:12px; color:#999; }
  /* 模态框右下角拖拽缩放手柄（放在 footer 右侧留白区，避免遮挡保存/取消按钮） */
  .modal-resize { position:absolute; right:0; bottom:0; width:18px; height:18px; cursor:nwse-resize; z-index:8; }
  .modal-resize::after { content:""; position:absolute; right:3px; bottom:3px; width:9px; height:9px; border-right:2px solid rgba(0,0,0,.25); border-bottom:2px solid rgba(0,0,0,.25); border-bottom-right-radius:3px; }
  /* 通用模态框缩放手柄（动态创建，复用系统模态框样式） */
  .rsz-handle { position:absolute; right:0; bottom:0; width:18px; height:18px; cursor:nwse-resize; z-index:20; }
  .rsz-handle::after { content:""; position:absolute; right:3px; bottom:3px; width:9px; height:9px; border-right:2px solid rgba(0,0,0,.3); border-bottom:2px solid rgba(0,0,0,.3); border-bottom-right-radius:3px; }
  /* 模态框四边/四角缩放热区（上/下/左/右四边 + 四角） */
  .rsz-e { position:absolute; top:0; right:0; width:6px; height:100%; cursor:ew-resize; z-index:19; }
  .rsz-w { position:absolute; top:0; left:0; width:6px; height:100%; cursor:ew-resize; z-index:19; }
  .rsz-s { position:absolute; left:0; bottom:0; width:100%; height:6px; cursor:ns-resize; z-index:19; }
  .rsz-n { position:absolute; left:0; top:0; width:100%; height:6px; cursor:ns-resize; z-index:19; }
  .rsz-ne { position:absolute; top:0; right:0; width:14px; height:14px; cursor:nesw-resize; z-index:20; }
  .rsz-nw { position:absolute; top:0; left:0; width:14px; height:14px; cursor:nwse-resize; z-index:20; }
  .rsz-sw { position:absolute; bottom:0; left:0; width:14px; height:14px; cursor:nesw-resize; z-index:20; }
  /* 概况类模态框的按钮容器始终置顶可见（内容滚动时不被遮挡），具体样式由 .modal-actions 统一规则控制 */

  /* ===== 审批模块（橙色主题） ===== */

  table.appr-table thead th { position:sticky; top:0; background:var(--appr-orange); color:#fff; text-align:left; padding:10px 12px; font-weight:600; white-space:nowrap; border-bottom:2px solid #e0741a; }

function openProjectReport(id) {
  window.__rptOpener = function(){ openProjectReport(id); };
  if (!permGuard('WON-D4')) return;
  var p = globalWonData.find(function(x){return x.id===id;});
  var _Lrpt = (window.CUR_LANG || CUR_LANG || 'zh');
  if (!p) { var t=(typeof I18N!=='undefined' && I18N[_Lrpt])?I18N[_Lrpt]:{}; showAlert(t.rpt_not_found||'Project not found'); return; }
  var t = (typeof I18N!=='undefined' && I18N[_Lrpt]) ? I18N[_Lrpt] : {};
  var rpt = function(k){return (t[k]!==undefined)?t[k]:k;};

  // 元信息
  document.getElementById('rptTitle').textContent = '📊 ' + rpt('rpt_title');

  html += '<div class="rpt-row"><span class="k">'+rpt('rpt_salesperson')+'</span><span class="v">'+(p.salesperson||'—')+'</span></div>';
  html += '<div class="rpt-row"><span class="k">'+rpt('rpt_payment_terms')+'</span><span class="v">'+(paymentTermsDisplay(p)||'—')+'</span></div>';
  html += '<div class="rpt-row"><span class="k">'+rpt('rpt_bu')+'</span><span class="v">'+buDisplay(p.doc_remark)+'</span></div>';
  html += '<div class="rpt-row"><span class="k">'+rpt('rpt_vat')+'</span><span class="v">'+(rpt('rpt_rmb')+': '+(p.vat_rmb||0).toLocaleString()+' / '+rpt('rpt_usd')+': '+(p.vat_usd||0).toLocaleString()+' / '+rpt('rpt_vnd')+': '+(p.vat_vnd||0).toLocaleString())+'</span></div>';

    // ④ AGI→GS 合同执行
    html += '<div class="rpt-sec"><div class="rpt-sec-title">④ '+rpt('rpt_sec4')+'</div>';
    html += '<div class="rpt-row"><span class="k">'+rpt('rpt_payable')+' (RMB/USD/VND)</span><span class="v">'+(p.agi_payable_rmb||0).toLocaleString()+' / '+(p.agi_payable_usd||0).toLocaleString()+' / '+(p.agi_payable_vnd||0).toLocaleString()+'</span></div>';
    html += '<div class="rpt-row"><span class="k">'+rpt('rpt_paid')+' (RMB/USD/VND)</span><span class="v">'+(p.agi_paid_rmb||0).toLocaleString()+' / '+(p.agi_paid_usd||0).toLocaleString()+' / '+(p.agi_paid_vnd||0).toLocaleString()+'</span></div>';
    html += '<div class="rpt-row"><span class="k">'+rpt('rpt_unpaid')+' (RMB/USD/VND)</span><span class="v">'+(p.agi_unpaid_rmb||0).toLocaleString()+' / '+(p.agi_unpaid_usd||0).toLocaleString()+' / '+(p.agi_unpaid_vnd||0).toLocaleString()+'</span></div>';
    html += '</div>';

    // ⑤ 补充协议
    html += '<div class="rpt-sec"><div class="rpt-sec-title">⑤ '+rpt('rpt_sec5')+'</div>';
    var suppCount = (p.doc_addendum_cnt)||0;
    if (suppCount>0) {
      html += '<div class="rpt-row"><span class="k">'+rpt('rpt_supp_count')+'</span><span class="v">'+suppCount+'</span></div>';
      // 尝试解析 supp_summary
      try {
        var supp = (typeof p.supp_summary==='string') ? JSON.parse(p.supp_summary) : (p.supp_summary||[]);
        if (supp.length) {
          supp.forEach(function(s,i){
            html += '<div class="rpt-supp-item">#'+(i+1)+' · '+(s.date||'')+' · '+(tlPick(s.desc||s.description||'')||'')+' · RMB:'+((s.amt_rmb||s.amount_rmb||0).toLocaleString())+'</div>';
          });
        }
      } catch(e) {}
    } else {
      html += '<div class="rpt-row"><span class="k">'+rpt('rpt_no_supp')+'</span><span class="v">—</span></div>';
    }
    html += '</div>';
  }

  // ⑥ 预算 vs 实际对比（P345 隐藏时编号顺位改为 ③）
  html += '<div class="rpt-sec"><div class="rpt-sec-title">'+(p345Hide?'③':'⑥')+' '+rpt('rpt_sec6')+'</div>';
  html += '<table class="rpt-tbl"><thead><tr><th>'+rpt('rpt_fb')+'</th><th>'+rpt('rpt_budget')+' (RMB)</th><th>'+rpt('rpt_actual')+' (RMB)</th><th>'+rpt('rpt_diff')+' (RMB)</th></tr></thead><tbody>';
  var rows = [
    [rpt('rpt_fb'), p.fb_budget_rmb||0, p.fb_actual_rmb||0],
    [rpt('rpt_cc'), p.cc_budget_rmb||0, p.cc_actual_rmb||0],
    [rpt('rpt_inst'), p.inst_budget_rmb||0, p.inst_actual_rmb||0]
  ];
  rows.forEach(function(r){
    var diff = r[2]-r[1];
    var cls = diff<0 ? 'rpt-pos' : (diff>0 ? 'rpt-neg' : '');
    var sign = diff<0 ? ' '+rpt('rpt_diff_pos') : (diff>0 ? ' '+rpt('rpt_diff_neg') : '');
    html += '<tr><td style="text-align:left;font-weight:600;">'+r[0]+'</td><td>'+(r[1]).toLocaleString()+'</td><td>'+(r[2]).toLocaleString()+'</td><td class="'+cls+'">'+(diff>=0?'+':'')+diff.toLocaleString()+sign+'</td></tr>';
  });
  // VND 行
  html += '<tr><td colspan="4" style="background:#FBE9E7;font-weight:700;color:#B71C1C;text-align:left;">'+rpt('rpt_vnd')+'</td></tr>';
  var rowsV = [
    [rpt('rpt_fb'), p.fb_budget_vnd||0, p.fb_actual_vnd||0],
    [rpt('rpt_cc'), p.cc_budget_vnd||0, p.cc_actual_vnd||0],
    [rpt('rpt_inst'), p.inst_budget_vnd||0, p.inst_actual_vnd||0]
  ];
  rowsV.forEach(function(r){
    var diff = r[2]-r[1];
    var cls = diff<0 ? 'rpt-pos' : (diff>0 ? 'rpt-neg' : '');
    var sign = diff<0 ? ' '+rpt('rpt_diff_pos') : (diff>0 ? ' '+rpt('rpt_diff_neg') : '');
    html += '<tr><td style="text-align:left;">'+r[0]+'</td><td>'+(r[1]).toLocaleString()+'</td><td>'+(r[2]).toLocaleString()+'</td><td class="'+cls+'">'+(diff>=0?'+':'')+diff.toLocaleString()+sign+'</td></tr>';
  });
  html += '</tbody></table></div>';

  // ★ 项目综合报告改为新窗口/新标签页打开，不遮挡当前主页
  var _rptEsc = function(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); };
  var _rptTitle = _rptEsc('📊 ' + rpt('rpt_title') + ' · ' + (p.contract_no||'') + ' · ' + (p.customer||''));
  var _rptHead = _rptEsc(rpt('rpt_title'));
  var _rptSub = _rptEsc((p.contract_no||'') + ' · ' + (p.customer||''));
  var _rptFoot = _rptEsc(rpt('rpt_title') + ' · ' + (p.contract_no||''));
  var _rptModal = '<div class="rpt-modal"><div class="rpt-head"><h3>' + _rptHead + '</h3><span>' + _rptSub + '</span></div><div class="rpt-body">' + html + '</div><div class="rpt-foot"><span>' + _rptFoot + '</span><div><button class="rpt-btn rpt-btn-outline" onclick="window.print()">🖨 ' + _rptEsc(rpt('rpt_print')) + '</button></div></div></div>';
  var _rptDoc = '<!DOCTYPE html><html lang="' + _Lrpt + '"><head><meta charset="utf-8"><title>' + _rptTitle + '</title><style>' + PROJECT_REPORT_CSS + '</style><style>
:root{
  --row-h:40px; --head-h:66px;
  --bd:#e3e8ee; --bd2:#eef1f4;
  --txt:#263238; --txt2:#546e7a; --txt3:#90a4ae;
  --bg:#f6f8fa; --card:#fff; --pri:#1e88e5;
  --ok:#43a047; --warn:#fb8c00; --bad:#e53935;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif}
.page{margin:0;padding:8px 0 24px}
.hdr{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:2px}
.hdr h1{font-size:18px;margin:0;font-weight:600}
.hdr .sub{font-size:12px;color:var(--txt3)}
.hdr-btns{margin-left:auto;display:flex;gap:8px;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-top:12px}
.card h2{font-size:13px;margin:0 0 10px;font-weight:600;color:#37474f;display:flex;align-items:center;gap:8px}
.card h2 .tg{font-size:11px;font-weight:400;color:var(--txt3)}
/* 区汇总 + 小组负载：一起折叠/展开 */
.cards-wrap{position:relative}
.cards-toggle{position:absolute;top:6px;right:8px;z-index:6;width:26px;height:26px;padding:0;
  border-radius:50%;border:1px solid #cfd8dc;background:#fff;color:#455a64;font-size:16px;font-weight:700;
  line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.15)}
.cards-toggle:hover{border-color:var(--pri);color:var(--pri)}
.cards-wrap.collapsed .card-body{display:none}
.btn{border:1px solid var(--bd);background:#fff;color:var(--txt2);border-radius:6px;
  padding:5px 11px;font-size:12px;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--pri);color:var(--pri)}
.btn.primary{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.primary:hover{background:#1976d2;color:#fff}
.btn.ghost{background:transparent}
.btn.mini{padding:3px 8px;font-size:11px}
.hint{font-size:11px;color:var(--txt3);line-height:1.6}
.row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:3px}
.fld label{font-size:11px;color:var(--txt2)}
.fld input,.fld select{border:1px solid var(--bd);border-radius:6px;padding:4px 8px;font:inherit;font-size:12px;background:#fff;min-width:88px}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--pri)}
.fld input.ro,.fld input[readonly]{background:#f0f0f0;color:#546e7a;cursor:default}
/* 日期选择输入框（如「预计安装日期」）：虽 readonly（点击弹日历选择），但外观必须像可编辑输入框，不要灰底 */
.fld .cp-date-input-wrapper input[readonly]{background:#fff;color:var(--txt);cursor:pointer}
.fld .cp-date-input-wrapper input[readonly]:hover{border-color:var(--pri)}
.fld .cp-date-input-wrapper input[readonly]:focus{border-color:var(--pri);outline:none}
/* 排程参数：强制单行（三语都是一行），等分压缩各输入框宽度 */
.params-row{flex-wrap:nowrap;gap:6px;align-items:flex-end}
.params-row .fld{flex:1 1 auto;min-width:0}
/* 标签与输入框一样左右居中；标签不换行（一行显示），字段宽度按标签内容自适应，多余空间均分 */
.params-row .fld label{font-size:10px;line-height:1.15;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis}
.params-row .fld input,.params-row .fld select{width:100%;min-width:0;box-sizing:border-box;padding:4px 6px;font-size:12px;text-align:center}
/* 日期选择框对齐：wrapper 不再加内边距，内部 input 与其它输入框完全同高同基线 */
.params-row .fld .cp-date-input-wrapper{width:100%;min-width:0;box-sizing:border-box;padding:0;margin:0}
.params-row .fld .cp-date-input-wrapper input{width:100%;min-width:0;box-sizing:border-box;padding:4px 6px;background:#fff;border:1px solid var(--bd);border-radius:6px;font:inherit;font-size:12px;text-align:center}
.params-row .btn{flex:0 0 auto;white-space:nowrap}
textarea{width:100%;min-height:78px;border:1px solid var(--bd);border-radius:6px;padding:7px 9px;
  font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;resize:vertical;background:#fff}
textarea:focus{outline:none;border-color:var(--pri)}

/* ---------- KPI ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:4px 11px;font-size:12px;color:var(--txt2)}
.chip b{color:var(--txt);font-weight:600}
.chip.danger{background:#ffebee;border-color:#ffcdd2;color:#c62828}
.chip.danger b{color:#b71c1c}
.chip.ok{background:#e8f5e9;border-color:#c8e6c9;color:#2e7d32}
.chip.ok b{color:#1b5e20}

/* ---------- 布局 ---------- */
.layout{display:flex;border:1px solid var(--bd);border-radius:10px;overflow:hidden;
  background:var(--card);height:560px;position:relative;margin-top:12px}
.tbl-wrap{width:var(--tbl-w,470px);flex:0 0 auto;overflow:auto;background:#fafbfc;
  border-right:1px solid var(--bd);scrollbar-width:thin;
  -webkit-font-smoothing:antialiased;will-change:scroll-position}
.tbl-wrap::-webkit-scrollbar{width:0;height:9px}
.tbl-wrap::-webkit-scrollbar-track{background:#f0f2f5}
.tbl-wrap::-webkit-scrollbar-thumb{background:#c4cdd4;border-radius:5px}
.tbl-wrap table{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12px}
/* 注意：这里【不能】再写 position:relative，否则会覆盖 position:sticky 导致表头不冻结
   （sticky 本身即为定位元素，.rs 绝对定位相对它即可） */
.tbl-wrap th{position:sticky;top:0;z-index:3;background:#f4f6f8;color:#455a64;font-weight:600;
  height:var(--head-h);padding:0 8px;text-align:left;border-bottom:1px solid var(--bd);
  white-space:nowrap;vertical-align:middle;background-clip:padding-box}
.tbl-wrap th .rs{position:absolute;right:0;top:0;bottom:0;width:8px;cursor:col-resize;z-index:4}
.tbl-wrap th .rs::after{content:'';position:absolute;right:3px;top:6px;bottom:6px;width:1px;background:#cfd8dc}
.tbl-wrap th .rs:hover::after{right:2px;width:3px;background:var(--pri);top:2px;bottom:2px}
.tbl-wrap th.rs-on{background:#e3f2fd !important}
.tbl-wrap td{height:var(--row-h);padding:0 6px;border-bottom:1px solid var(--bd2);
  white-space:nowrap;overflow:hidden;vertical-align:middle}
.tbl-wrap tr:hover td{background:#f0f7ff}
.tbl-wrap tr.sel td{background:#e3f2fd}
.tbl-wrap tr.sel td:first-child{box-shadow:inset 3px 0 0 var(--pri)}
.tbl-wrap tr.zrow td{background:#f7f9fb;font-weight:600;color:#37474f}
.tbl-wrap tr.trow td{background:#fcfdfe;color:var(--txt2);font-style:italic}
.tbl-wrap tr.msrow td{background:#fffdf5;color:#8d6e63;font-size:11px}
.tbl-wrap td .hn-l1{font-weight:600;color:#263238;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-wrap td .hn-l2{font-size:10px;color:#78909c;line-height:1.2;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbl-wrap td .ro-num{color:#90a4ae;cursor:default;font-variant-numeric:tabular-nums}
.tbl-wrap input,.tbl-wrap select{width:100%;border:1px solid transparent;background:transparent;
  font:inherit;font-size:11px;padding:3px 4px;border-radius:4px;color:var(--txt)}
.tbl-wrap input:hover,.tbl-wrap select:hover{border-color:#cfd8dc;background:#fff}
.tbl-wrap input:focus,.tbl-wrap select:focus{outline:none;border-color:var(--pri);background:#fff}
.tbl-wrap input[type=checkbox]{width:auto}
.tbl-wrap .num{text-align:center;font-variant-numeric:tabular-nums}
.tbl-wrap .lk{color:var(--warn);font-size:10px;margin-left:2px}
.collapse-btn{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border:1px solid var(--bd);border-radius:4px;background:#fff;cursor:pointer;font-size:10px;line-height:1;margin-right:6px;color:var(--txt2);transition:.15s;vertical-align:middle}
.collapse-btn:hover{border-color:var(--pri);color:var(--pri)}
.empty{height:auto !important;text-align:center;color:var(--txt3);padding:22px 0 !important}
body.col-resizing,body.col-resizing *{cursor:col-resize !important;user-select:none !important}

.splitter{flex:0 0 auto;width:7px;margin:0 -1px;cursor:col-resize;position:relative;z-index:6}
.splitter::before{content:'';position:absolute;inset:0 -4px}
.splitter::after{content:'';position:absolute;left:3px;top:0;bottom:0;width:1px;background:var(--bd)}
.splitter:hover::after,.splitter.on::after{left:2.5px;width:2px;background:var(--pri)}
.splitter.on{background:#e3f2fd}
.splitter .knob{position:absolute;left:1px;top:50%;width:5px;height:26px;margin-top:-13px;
  border-radius:3px;background:var(--pri);opacity:0;transition:opacity .15s}
.splitter:hover .knob,.splitter.on .knob{opacity:1}
body.resizing,body.resizing *{cursor:col-resize !important;user-select:none !important}

/* ---------- 显示设置面板 ---------- */
.cfg{width:0;overflow:hidden;transition:width .18s ease;background:#fff;flex:0 0 auto}
.cfg.no-anim{transition:none !important}
.cfg.open{width:250px;border-left:1px solid var(--bd);overflow:auto}
.cfg-h{display:flex;justify-content:space-between;align-items:center;padding:9px 11px;
  font-weight:600;font-size:12px;color:#37474f;border-bottom:1px solid var(--bd2);
  position:sticky;top:0;background:#fff;z-index:2}
.cfg-h button{border:0;background:none;color:var(--txt3);font-size:16px;cursor:pointer;line-height:1}
.cfg-b{padding:9px 11px 20px}
.cfg-sec{margin-bottom:16px}
.cfg-t{font-size:11px;font-weight:600;color:#78909c;margin-bottom:7px;
  text-transform:uppercase;letter-spacing:.4px}
.cfg label{display:flex;align-items:center;gap:7px;font-size:12px;color:#455a64;padding:4px 0}
.cfg select,.cfg input[type=range]{flex:1;min-width:0}
.cfg input[type=range]{accent-color:var(--pri)}
.cfg input[type=checkbox]{accent-color:var(--pri)}
.cfg label .cw{margin-left:auto;font-size:10px;color:var(--txt3);font-variant-numeric:tabular-nums}
.cfg .fld-lbl{display:block;font-size:12px;color:#455a64;padding:4px 0}
.cfg textarea{width:100%;min-height:46px;font-size:11px;margin-top:3px}
.cfg-btns{display:flex;gap:6px;margin-top:8px}
.cfg-btns button{flex:1;border:1px solid var(--bd);background:#fff;border-radius:5px;
  padding:4px 6px;font-size:11px;color:var(--txt2);cursor:pointer}
.cfg-btns button:hover{border-color:var(--pri);color:var(--pri)}
.cfg-hint{font-size:10px;color:var(--txt3);margin-top:7px;line-height:1.5}

/* ---------- 甘特 ---------- */
.chart-wrap{flex:1 1 auto;overflow:auto;position:relative;background:#fff;will-change:scroll-position}
.ci{position:relative}
.thead{position:sticky;top:0;z-index:4;background:#fff;border-bottom:1px solid var(--bd);height:var(--head-h)}
.tu{display:flex;height:30px;border-bottom:1px solid var(--bd2)}
.tu>div{font-size:11px;font-weight:600;color:#455a64;padding:0 6px;border-right:1px solid var(--bd2);
  overflow:hidden;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.tl{display:flex;height:34px}
.tl>div{font-size:10px;color:var(--txt2);border-right:1px solid var(--bd2);overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;white-space:nowrap}
.tl>div .t1{line-height:13px;font-weight:600}
.tl>div .t2{line-height:12px;font-size:9px;color:var(--txt3);margin-top:1px}
.tl>div.we .t1{color:#e57373}
.tl>div.we{background:#fff8f8}
.bd{position:relative;
  background-image:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0 calc(var(--row-h) - 1px),
    var(--bd2) calc(var(--row-h) - 1px) var(--row-h))}
.wkend{position:absolute;top:0;bottom:0;background:#fafbfc}
.wkend.sat{border-right:1px dashed #eceff1}
.cl{position:absolute;top:0;bottom:0;width:1px;background:var(--bd2)}
.today-line{position:absolute;top:0;bottom:0;width:2px;background:#e53935;z-index:3;opacity:.9}
.today-line::after{content:'';position:absolute;top:0;left:-4px;border:5px solid transparent;border-top-color:#e53935}
/* 今天标记：三角旗放在粘性表头内，始终钉在图表顶部，避免滚动后顶端被裁切 */
.today-flag{position:absolute;top:0;bottom:0;width:2px;background:#e53935;z-index:7;opacity:.9;pointer-events:none}
.today-flag::after{content:'';position:absolute;top:0;left:-4px;border:5px solid transparent;border-top-color:#e53935}
.deps{position:absolute;left:0;top:0;overflow:visible;z-index:3;pointer-events:none}
.deps.dragging{opacity:.35}
.bar{position:absolute;border-radius:3px;z-index:2;cursor:grab;touch-action:none;
  background:transparent;overflow:hidden;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar:active{cursor:grabbing}
.bar.sel{outline:2px solid var(--pri);outline-offset:1px}
.bar::before{content:attr(data-lbl);position:absolute;left:6px;top:0;bottom:0;display:flex;align-items:center;
  font-size:10px;white-space:nowrap;pointer-events:none;color:var(--fg,#fff);z-index:4;
  text-shadow:0 1px 2px rgba(0,0,0,.5)}
.bar.out::before{left:calc(100% + 6px);color:var(--txt2);text-shadow:none}
/* 窄条（<48px）时标签放到条外，必须允许溢出，否则被 .bar{overflow:hidden} 裁掉 → 看不到基础信息 */
.bar.out{overflow:visible}
/* 横道图自绘 tooltip（替代原生 title，保证内容可见） */
.ig-tip{position:fixed;display:none;z-index:9999;max-width:360px;background:#263238;color:#fff;
  font-size:11px;line-height:1.55;padding:8px 10px;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.4);
  pointer-events:none;white-space:pre-line;word-break:break-word}
.bar::after{content:'';position:absolute;right:0;top:0;bottom:0;width:7px;background:transparent;z-index:4}
.bar:hover::after{background:rgba(255,255,255,.42)}
.bar-seg{position:absolute;top:0;height:100%;border-radius:0;pointer-events:none}
.bar-progress{position:absolute;top:0;left:0;height:100%;z-index:3;pointer-events:none}
.bar:hover{box-shadow:0 1px 2px rgba(0,0,0,.12),inset 0 -7px 0 -4px rgba(255,255,255,.55)}
.bar.sum{border-radius:2px;height:9px !important;z-index:2}
.bar.sum::before{content:none}
.bar.sum::after{content:none}
.bar.ms{border-radius:0;clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%);
  box-shadow:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.28))}
.bar.ms::before,.bar.ms::after{content:none}
.bar.ms:hover{filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}
.bar.fixed{cursor:default;opacity:.97}
.bar.locked{box-shadow:0 0 0 1.5px var(--warn),0 1px 2px rgba(0,0,0,.12)}
.base{position:absolute;height:4px;background:#cbd5e0;border-radius:2px;z-index:1;opacity:.9}
.deps.dragging{opacity:.35}

/* ---------- 资源负载 ---------- */
.loadgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.load{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.load .lh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.load .ln{font-size:12px;font-weight:600;color:#37474f}
.load .lv{font-size:11px;color:var(--txt2)}
.load .lbar{height:14px;background:#eceff1;border-radius:4px;overflow:hidden;display:flex}
.load .lbar i{display:block;height:100%}
.load .lf{font-size:10px;color:var(--txt3);margin-top:5px;line-height:1.5}
.load .lf b{color:var(--txt2);font-weight:600}
.warnbox{margin-top:10px;background:#fff8e1;border:1px solid #ffe082;border-radius:8px;
  padding:8px 11px;font-size:12px;color:#795548}
.warnbox ul{margin:4px 0 0;padding-left:18px}
.legend{margin-top:10px;display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--txt2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table.zt{width:100%;border-collapse:collapse;font-size:12px}
table.zt th{background:#f4f6f8;color:#455a64;font-weight:600;text-align:left;padding:6px 9px;border-bottom:1px solid var(--bd)}
table.zt td{padding:6px 9px;border-bottom:1px solid var(--bd2)}
table.zt td.n{text-align:center;font-variant-numeric:tabular-nums}
table.zt tr:hover td{background:#f7fbff}
@media (max-width:1000px){
  .layout{height:auto;flex-direction:column}
  .tbl-wrap{width:100% !important;max-height:260px;border-right:0;border-bottom:1px solid var(--bd)}
  .chart-wrap{min-height:360px}
  .splitter{display:none}
  .cfg.open{width:100%}
  }
  /* ===== 日历弹出框（iframe 内自包含，与父页 cp-cal 标准设计一致） ===== */
  .cp-date-input-wrapper { display:inline-flex; align-items:center; width:100%; gap:2px; min-width:100px; }
  .cp-date-input-wrapper input { flex:1; min-width:60px; padding:2px 4px; cursor:pointer; background:white; }
  .cp-date-input-wrapper input:focus { outline:none; border-color:#E53935; }
  .cp-date-input-wrapper input:disabled { background:#f0f0f0; cursor:not-allowed; opacity:0.6; }
  .cp-cal-popup { position:fixed;z-index:30000;width:240px;background:#fff;border:1px solid #f0c8a8;border-radius:10px;box-shadow:0 12px 30px rgba(40,30,15,.25);padding:10px 12px;font-size:12px;display:none; }
  .cp-cal-popup.show { display:block; }
  .cp-cal-head { display:flex;align-items:center;justify-content:space-between;margin-bottom:6px; }
  .cp-cal-head button { width:24px;height:24px;border:none;background:#FDECEA;color:#E53935;border-radius:5px;cursor:pointer;font-size:13px;font-weight:700;display:inline-flex;align-items:center;justify-content:center; }
  .cp-cal-head button:hover { background:#E53935;color:#fff; }
  .cp-cal-title { font-weight:700;color:#E53935;font-size:12px; }
  .cp-cal-close { width:24px;height:24px;border:none;background:none;color:#999;font-size:17px;line-height:1;cursor:pointer;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;padding:0; }
  .cp-cal-close:hover { background:#fde8e8;color:#e74c3c; }
  .cp-cal-week { display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:2px; }
  .cp-cal-week span { text-align:center;font-size:10px;color:#999;font-weight:700;padding:2px 0; }
  .cp-cal-grid { display:grid;grid-template-columns:repeat(7,1fr);gap:2px; }
  .cp-cal-grid button { width:100%;aspect-ratio:1/1;border:none;background:transparent;font-size:11px;color:#333;border-radius:5px;cursor:pointer;padding:0; }
  .cp-cal-grid button:hover:not(.empty):not(.selected):not(.disabled) { background:#FDECEA;color:#E53935; }
  .cp-cal-grid button.empty { visibility:hidden; }
  .cp-cal-grid button.today { box-shadow:inset 0 0 0 1.5px #E53935;color:#E53935;font-weight:700; }
  .cp-cal-grid button.selected { background:#E53935;color:#fff;font-weight:700; }
  .cp-cal-grid button.disabled { color:#bbb;background:#f5f5f5;cursor:not-allowed; }
  .cp-cal-foot { display:flex;justify-content:space-between;align-items:center;gap:4px;margin-top:6px;padding-top:5px;border-top:1px dashed #eee; }
  .cp-cal-foot .cp-cal-fmt { font-size:9.5px;color:#bbb; }
  .cp-cal-foot .cp-cal-today { border:1px solid #E53935;background:#fff;color:#E53935;font-size:10px;padding:3px 8px;border-radius:5px;cursor:pointer; }
  .cp-cal-foot .cp-cal-today:hover { background:#E53935;color:#fff; }
  .cp-cal-foot .cp-cal-clear { border:none;background:none;color:#999;font-size:10px;cursor:pointer;padding:2px 5px;border-radius:4px; }
  .cp-cal-foot .cp-cal-clear:hover { background:#fde8e8;color:#e74c3c; }

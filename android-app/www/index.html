<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>CHOICE SLATS</title>
  <style>
    html,body{margin:0;height:100%;background:#f2f4f7;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;}

    .dot{width:44px;height:44px;border-radius:12px;background:#D32F2F;color:#fff;font-weight:800;
         display:flex;align-items:center;justify-content:center;font-size:18px;}
    code{background:#fff;border:1px solid #e3e7ec;border-radius:6px;padding:2px 6px;font-size:12px;}
  </style>
</head>
<body>
  <div class="box">
    <div class="dot">CS</div>
    <div><b>CHOICE SLATS</b></div>
    <div>正在连接服务器…</div>
    <div style="font-size:12px;color:#8a97a5">若长时间停在此页，请检查<br><code>android-app/capacitor.config.json</code> 里的 <code>server.url</code></div>
  </div>
  <script>
    // 兜底：webDir 只是 Capacitor 的占位，真正界面来自 server.url（远程 /lite）。
    // 若远程地址没配置好，这里不会做任何跳转，便于看出是配置问题。
  </script>
</body>
</html>
